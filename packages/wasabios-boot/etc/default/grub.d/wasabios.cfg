# WasabiOS の起動メニュー (GRUB) の設定
GRUB_DISTRIBUTOR="WasabiOS"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
# loglevel=5: 起動ロゴを出しつつ、重要なメッセージだけ表示 (quiet にするとロゴが消える)
# splash: そのあとはグラフィカルな起動画面 (Plymouth)
GRUB_CMDLINE_LINUX_DEFAULT="loglevel=5 splash"
# 同じディスクの別の OS (元の Ubuntu など) もメニューに出す
GRUB_DISABLE_OS_PROBER=false
