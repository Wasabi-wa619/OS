# GitHub 上で ISO を自動ビルドする。
# Actions タブ → "Build ISO" → "Run workflow" で実行し、
# 完了後に Artifacts から ISO をダウンロードできる。
name: Build ISO

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "デスクトップ環境"
        type: choice
        options: [xfce, gnome, kde, none]
        default: xfce
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools \
            grub-common grub-pc-bin grub-efi-amd64-bin

      - name: Build
        run: sudo DESKTOP="${{ inputs.desktop || 'xfce' }}" ./scripts/build.sh

      - name: Checksum
        run: cd out && sha256sum *.iso | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ inputs.desktop || 'xfce' }}
          path: out/*
          compression-level: 0

      - name: Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
