# GitHub 上で自動ビルドする。
# - kernel : WasabiOS カーネル (.deb)。設定が変わらない限りキャッシュを使う (初回は数時間)
# - debs   : WasabiOS の独自パッケージ (.deb)。push のたびに作る
# - iso    : フル版 ISO (WasabiOS カーネル + 自作 init + Ubuntu のユーザーランド)。手動実行とタグのとき
# - scratch: シード版 ISO (initramfs だけで動く小さい版)
# - v0.1 のようなタグを push すると Releases に .deb と ISO を添付する
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      desktop:
        description: "デスクトップ環境"
        type: choice
        options: [gnome, xfce, kde, none]
        default: gnome
      mac_support:
        description: "MacBook 向けドライバーを入れる"
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: out/kernel
          key: kernel-${{ hashFiles('scratch/versions.conf', 'scratch/kernel/**') }}
      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build kernel
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc flex bison libelf-dev libssl-dev libdw-dev gawk \
            rsync kmod dpkg-dev zstd debhelper cpio curl
          bash ./scratch/kernel/build-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/kernel/*.deb

  debs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb packages
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          bash ./scripts/build-debs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/debs/*.deb

  iso:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: out/kernel
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools librsvg2-bin \
            grub-common grub-pc-bin grub-efi-amd64-bin
      - name: Build ISO
        run: |
          sudo DESKTOP="${{ inputs.desktop || 'gnome' }}" \
               MAC_SUPPORT="${{ inputs.mac_support || 'yes' }}" \
               bash ./scripts/build.sh
      - name: Checksum
        run: cd out && sha256sum wasabios-[0-9]*.iso | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ inputs.desktop || 'gnome' }}
          path: |
            out/wasabios-[0-9]*.iso
            out/SHA256SUMS
          compression-level: 0

  scratch:
    needs: [kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: out/kernel
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cpio curl zstd kmod xorriso mtools \
            grub-common grub-pc-bin grub-efi-amd64-bin
      - name: Build WasabiOS Scratch (seed)
        run: bash ./scratch/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iso-scratch
          path: out/wasabios-scratch-*.iso

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debs, iso, scratch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # GitHub Releases は1ファイル 2GiB まで。超える ISO は分割して添付する
      - name: Split large ISO
        run: |
          cd dist
          for f in *.iso; do
            if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
              split -b 1900M -d "$f" "$f.part"
              rm "$f"
            fi
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
