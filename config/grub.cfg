set timeout=5
set default=0

insmod all_video
insmod gfxterm
loadfont unicode
terminal_output gfxterm

# wasabi.live: 自作の init が USB/DVD の中の /wasabios/root.squashfs を探して起動する
# loglevel=5: カーネルの起動ロゴを出す (quiet にするとロゴが消える)
menuentry "@OS_NAME@ を起動" {
    linux  /boot/vmlinuz wasabi.live loglevel=5 splash
    initrd /boot/initrd.img
}

menuentry "@OS_NAME@ を起動 (セーフグラフィックス)" {
    linux  /boot/vmlinuz wasabi.live loglevel=5 nomodeset
    initrd /boot/initrd.img
}

menuentry "@OS_NAME@ を起動 (メモリに全部読み込む・USB を抜ける)" {
    linux  /boot/vmlinuz wasabi.live wasabi.toram loglevel=5 splash
    initrd /boot/initrd.img
}

menuentry "レスキュー (自作 init のシェル)" {
    linux  /boot/vmlinuz loglevel=5
    initrd /boot/initrd.img
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI ファームウェア設定" {
        fwsetup
    }
fi
