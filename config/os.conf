# ===== 独自OSの基本設定 =====
# ここを書き換えるだけでOSの名前やベースを変えられます。

OS_NAME="WasabiOS"            # 表示名
OS_ID="wasabios"              # 小文字・空白なし (os-release の ID)
OS_VERSION="0.1"
OS_CODENAME="sprout"
OS_HOSTNAME="wasabi"

# ベースにするUbuntuのリリース (noble = 24.04 LTS)
BASE_SUITE="noble"
BASE_MIRROR="http://archive.ubuntu.com/ubuntu"
ARCH="amd64"

# デスクトップ環境: xfce / gnome / kde / none(CUIのみ)
DESKTOP="${DESKTOP:-xfce}"   # make iso DESKTOP=none のように上書きも可

# ライブ環境のユーザー (パスワードなしでログイン)
LIVE_USER="wasabi"

# 日本語環境
LOCALE="ja_JP.UTF-8"
TIMEZONE="Asia/Tokyo"
KEYMAP="jp"
