# ===== 独自OSの基本設定 =====
# ここを書き換えるだけでOSの名前やベースを変えられます。

OS_NAME="WasabiOS"            # 表示名
OS_ID="wasabios"              # 小文字・空白なし (os-release の ID)
OS_VERSION="0.1"
OS_CODENAME="sprout"
OS_HOSTNAME="wasabi"
OS_MAINTAINER="WasabiOS Developers <wasabios@localhost>"  # deb パッケージの作者欄

# ベースにするUbuntuのリリース (noble = 24.04 LTS)
BASE_SUITE="noble"
BASE_MIRROR="http://archive.ubuntu.com/ubuntu"
ARCH="amd64"

# デスクトップ環境: gnome (Ubuntu 標準と同じ) / xfce / kde / none(CUIのみ)
DESKTOP="${DESKTOP:-gnome}"   # make iso DESKTOP=none のように上書きも可

# Webブラウザ: firefox (Mozilla公式のdeb版) / none
BROWSER="${BROWSER:-firefox}"

# MacBook (2012年前後の Intel Mac) 向けのドライバーと設定を入れる: yes / no
MAC_SUPPORT="${MAC_SUPPORT:-yes}"

# ライブ環境のユーザー (パスワードなしでログイン)
LIVE_USER="wasabi"

# 日本語環境
LOCALE="ja_JP.UTF-8"
TIMEZONE="Asia/Tokyo"
KEYMAP="jp"
